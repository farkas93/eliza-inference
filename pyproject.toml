[project]
name = "eliza-inference"
version = "0.1.0"
description = "DGX Spark local inference stack for Qwen coding and Gemma voice endpoints"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.32.0",
  "openai>=1.82.0",
  "psutil>=7.2.2",
  "websockets>=13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
